<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153d36"><title>BioAventura · Aprendé jugando</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18372f;background:#edf4ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 5%,#d4ebce,transparent 45%),#edf4ee}.wrap{max-width:780px;margin:auto;padding:22px 16px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:28px}.brand{font-size:21px;font-weight:850;letter-spacing:-.7px}.brand span{color:#39876d}.tag{font-size:12px;border:1px solid #c4d7c8;border-radius:30px;padding:8px 12px;color:#426c5d}.card{background:#fff;border-radius:25px;padding:clamp(22px,5vw,42px);box-shadow:0 16px 50px #214b3214;border:1px solid #e0eae1}h1{font-size:clamp(34px,6vw,53px);line-height:1.08;letter-spacing:-1.8px;margin:14px 0}h2{font-size:clamp(24px,4vw,34px);line-height:1.22;letter-spacing:-.7px;margin:20px 0}p{line-height:1.65;color:#4a6258}.eyebrow{font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:11px;color:#428b6c}.heroIcon{font-size:56px}.btn{background:#195d47;color:white;border:0;border-radius:13px;padding:15px 22px;font:inherit;font-weight:750;cursor:pointer;min-height:50px}.btn:hover{background:#114b39}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#e7f0e9;color:#205744}.btn:focus-visible,.option:focus-visible{outline:3px solid #efad44;outline-offset:3px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;color:#668174;font-weight:650}.bar{height:9px;border-radius:10px;background:#e7eee8;overflow:hidden;margin:15px 0 25px}.fill{height:100%;background:#51a27b;transition:width .3s}.option{width:100%;display:flex;gap:13px;align-items:center;text-align:left;background:white;border:2px solid #e2eae4;border-radius:15px;padding:14px 15px;margin:10px 0;cursor:pointer;font:inherit;color:#1e3930;min-height:62px}.option:hover:not(:disabled){border-color:#6aaf89;background:#f7fbf7}.option:disabled{cursor:default}.letter{flex:0 0 31px;height:31px;border-radius:9px;background:#e9f1eb;display:grid;place-items:center;font-weight:800;font-size:13px}.option.correct{border-color:#339b6a;background:#effaf2}.option.wrong{border-color:#d67a6b;background:#fff3f1}.feedback{padding:18px 20px;border-radius:16px;margin:22px 0;background:#edf7f0;border-left:5px solid #319b6c}.feedback.wrong{background:#fff5ed;border-color:#df9854}.feedback strong{font-size:18px}.feedback p{margin:8px 0 0;color:#364d42}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}.muted{color:#728779;font-size:13px}.topics{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 28px}.pill{border-radius:50px;background:#e8f2ea;padding:8px 12px;font-size:12px;font-weight:700;color:#426d58}.score{font-size:66px;font-weight:850;letter-spacing:-3px;margin:12px 0}.review{padding:14px 0;border-top:1px solid #e2ebe5}.review b{display:block;margin-bottom:5px}.review small{color:#526b5d;line-height:1.5;display:block}.footer{text-align:center;font-size:12px;color:#789082;margin-top:22px}.hidden{display:none!important}@media(max-width:450px){header{margin-bottom:18px}.tag{font-size:10px}.actions{flex-direction:column;align-items:stretch}.actions .btn{width:100%}}
 .choices{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0 20px}.choice{padding:13px 22px;border:2px solid #d9e8dd;background:#fff;border-radius:12px;font:inherit;font-weight:800;cursor:pointer}.choice.active{background:#195d47;color:#fff;border-color:#195d47}.writebox{width:100%;min-height:155px;resize:vertical;border:2px solid #dce8df;border-radius:15px;padding:15px;font:inherit;line-height:1.6;color:#18372f;background:#ffffff;-webkit-text-fill-color:#18372f;caret-color:#18372f;color-scheme:light}.writebox::placeholder{color:#718579;-webkit-text-fill-color:#718579;opacity:1}.writebox:focus{outline:3px solid #9bd3ac}.help{font-size:13px;color:#637c6d}.selfbuttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.selfbuttons button{flex:1}.model{background:#f1f8f1;padding:15px;border-radius:12px;line-height:1.6;white-space:pre-line} </style></head><body><div class="wrap"><header><div class="brand">🌿 Bio<span>Aventura</span></div><div class="tag">CIENCIAS NATURALES · CÓRDOBA</div></header><main id="app" class="card" aria-live="polite"></main><div class="footer">Aprender también es equivocarse · Juego educativo gratuito</div></div><script>
const questions=[
{t:'Materia y células',q:'¿Cuál es la unidad básica de todos los seres vivos?',o:['El tejido','La célula','El órgano','La molécula'],a:1,e:'La célula es la unidad más pequeña capaz de realizar las funciones vitales. Un ser vivo puede tener una sola célula o muchísimas.'},
{t:'Materia y células',q:'¿Cuáles son las partículas que forman un átomo?',o:['Células y tejidos','Protones, neutrones y electrones','Órganos y moléculas','Mitocondrias y cloroplastos'],a:1,e:'Los átomos están formados por protones, neutrones y electrones. Son las unidades estructurales de la materia.'},
{t:'Materia y células',q:'¿Qué se forma cuando se unen dos o más átomos?',o:['Un órgano','Una célula','Una molécula','Un tejido'],a:2,e:'Los átomos pueden unirse para formar moléculas. Por ejemplo, una molécula de oxígeno gaseoso (O₂) tiene dos átomos de oxígeno.'},
{t:'Materia y células',q:'¿Qué hacen las mitocondrias?',o:['Participan en la respiración celular','Forman tejidos','Producen semillas','Dirigen el vuelo'],a:0,e:'Las mitocondrias realizan procesos de respiración celular que permiten obtener energía para las actividades de la célula.'},
{t:'Materia y células',q:'¿Qué hacen los cloroplastos?',o:['Transportan sangre','Realizan la fotosíntesis','Digieren alimentos','Forman órganos'],a:1,e:'Los cloroplastos de las células vegetales realizan la fotosíntesis, proceso que permite fabricar glucosa utilizando energía de la luz.'},
{t:'Organización de la vida',q:'¿Qué es un tejido?',o:['Un conjunto de órganos','Un conjunto de células especializadas','Una población de animales','Una molécula grande'],a:1,e:'Un tejido es un conjunto de células que trabajan juntas en una función. Por ejemplo, el tejido muscular permite el movimiento.'},
{t:'Organización de la vida',q:'¿Qué es un órgano?',o:['Una estructura formada por tejidos que cumple funciones','Una sola célula','Un grupo de animales','Un conjunto de átomos'],a:0,e:'Los órganos están formados por distintos tejidos. El estómago, por ejemplo, participa en la digestión.'},
{t:'Organización de la vida',q:'¿Qué es un sistema de órganos?',o:['Un grupo de especies','Órganos que trabajan coordinadamente','Una célula grande','Un ecosistema'],a:1,e:'Varios órganos colaboran para realizar una tarea. La boca, el esófago, el estómago y los intestinos forman parte del sistema digestivo.'},
{t:'Organización de la vida',q:'¿Cuál de estos ejemplos es un individuo?',o:['Cuatro zorros','Un zorro gris','Todos los animales de un bosque','Un bosque entero'],a:1,e:'Un individuo u organismo es un solo ser vivo. Un zorro gris es un individuo; varios zorros de la misma especie en una zona pueden formar una población.'},
{t:'Ecología',q:'¿Qué es una población?',o:['Todos los animales del planeta','Individuos de una misma especie en un área','Distintas especies juntas','Todos los ecosistemas'],a:1,e:'Una población está formada por individuos de la misma especie que habitan una zona en un tiempo determinado.'},
{t:'Ecología',q:'¿Qué es una comunidad?',o:['Poblaciones de distintas especies que conviven','Un grupo de órganos','Una sola especie','Una región con un clima particular'],a:0,e:'Una comunidad reúne poblaciones de especies diferentes que viven e interactúan en un mismo lugar, como árboles, aves, insectos y hongos de un bosque.'},
{t:'Ecología',q:'¿Qué incluye un ecosistema?',o:['Solo animales','Solo plantas','Seres vivos, elementos no vivos y sus relaciones','Solo el clima'],a:2,e:'Un ecosistema incluye los seres vivos (factores bióticos), el ambiente físico (factores abióticos) y las interacciones entre ambos.'},
{t:'Ecología',q:'¿Cuál de estos es un factor abiótico?',o:['Una hormiga','Un árbol','La temperatura','Un hongo'],a:2,e:'La temperatura es un factor abiótico porque no tiene vida. También son abióticos el agua, la luz y el suelo.'},
{t:'Ecología',q:'¿Cuál de estos es un factor biótico?',o:['El agua','Una planta','La temperatura','Una roca'],a:1,e:'Los factores bióticos son los componentes vivos de un ecosistema: plantas, animales, hongos y microorganismos.'},
{t:'Ecología',q:'¿Qué es un bioma?',o:['Una célula especial','Un conjunto de ecosistemas similares','Un solo animal','Una parte del cuerpo'],a:1,e:'Un bioma reúne ecosistemas semejantes por su vegetación y los animales que predominan. Por ejemplo, los desiertos y las sabanas.'},
{t:'Ecología',q:'¿Qué es la biosfera?',o:['Un bosque','Un órgano','El conjunto de todos los biomas del planeta','Una población'],a:2,e:'La biosfera es el nivel de organización más amplio del cuadernillo: reúne todos los biomas de la Tierra.'},
{t:'Fauna de Córdoba',q:'¿Qué tipo de mamífero es la comadreja overa?',o:['Un roedor','Un marsupial','Un reptil','Un anfibio'],a:1,e:'La comadreja overa es un marsupial. Sus crías nacen muy pequeñas y siguen desarrollándose en el marsupio de su madre.'},
{t:'Fauna de Córdoba',q:'¿Cómo se alimenta la comadreja overa?',o:['Solo de plantas','Solo de insectos','De alimentos animales y vegetales','Solo de carne'],a:2,e:'Es omnívora: come insectos, pequeños animales, frutas, huevos y otros alimentos disponibles.'},
{t:'Fauna de Córdoba',q:'¿Dónde siguen desarrollándose las crías de la comadreja?',o:['En un nido de barro','En el marsupio de la madre','En el agua','Debajo de piedras'],a:1,e:'Las crías nacen poco desarrolladas y se quedan en el marsupio, donde se aferran y toman leche hasta crecer.'},
{t:'Fauna de Córdoba',q:'¿Qué puede hacer la comadreja ante un peligro extremo?',o:['Volar','Cambiar de color','Simular estar muerta','Construir un nido'],a:2,e:'Puede quedarse inmóvil y parecer muerta. Este comportamiento puede ayudarla a escapar de algunos depredadores.'},
{t:'Fauna de Córdoba',q:'¿Por qué la comadreja es importante para el ecosistema?',o:['Porque fabrica oxígeno','Porque controla algunas plagas y consume carroña','Porque no tiene depredadores','Porque vive siempre en grupos'],a:1,e:'Al comer insectos y otros animales puede ayudar a controlar poblaciones; también consume animales muertos, cumpliendo una función ecológica.'},
{t:'Fauna de Córdoba',q:'¿De qué se alimenta principalmente la curucucha o ratona común?',o:['Insectos y arácnidos','Solo semillas','Peces','Pasto'],a:0,e:'La curucucha es insectívora: se alimenta de insectos y arácnidos que encuentra en plantas o en el suelo.'},
{t:'Fauna de Córdoba',q:'¿Para qué sirven las plumas timoneras?',o:['Para alimentarse','Para dirigir el vuelo','Para fabricar nidos','Para respirar'],a:1,e:'Las plumas timoneras están en la cola y ayudan a dirigir el vuelo. Las remeras, en cambio, son plumas de las alas que ayudan a volar.'},
{t:'Fauna de Córdoba',q:'¿Dónde suele construir su nido la curucucha?',o:['Solo bajo el agua','En huecos de árboles y otros rincones protegidos','En el fondo de lagos','Siempre en el suelo abierto'],a:1,e:'La curucucha construye nidos con pastos y plumas en huecos de árboles secos, caños, tejidos y otros rincones.'},
{t:'Fauna de Córdoba',q:'¿Por qué la curucucha puede vivir en ambientes diferentes?',o:['Porque no necesita alimentarse','Porque se adapta y encuentra insectos en muchos ambientes','Porque es un ave acuática','Porque no tiene depredadores'],a:1,e:'Puede adaptarse a distintos ecosistemas porque encuentra alimento en muchos lugares. En los apuntes se menciona que habita pastizales, jardines y cercanías de las casas.'}
];
const writing=[
{t:'Materia y células',q:'Explicá con tus palabras qué es una célula y por qué es importante.',model:'La célula es la unidad básica de los seres vivos. Puede realizar funciones vitales, y todos los organismos están formados por una o más células.',tip:'Pensá en la unidad más pequeña que puede estar viva.'},
{t:'Materia y células',q:'¿Qué diferencia hay entre una mitocondria y un cloroplasto?',model:'La mitocondria participa en la respiración celular y en la obtención de energía. El cloroplasto realiza la fotosíntesis en células vegetales.',tip:'Una interviene en la respiración celular y el otro en la fotosíntesis.'},
{t:'Organización de la vida',q:'Describí cómo se relacionan las células, los tejidos y los órganos. Incluí un ejemplo.',model:'Varias células especializadas forman un tejido; distintos tejidos forman un órgano. Por ejemplo, las células musculares forman tejido muscular, que integra órganos como el corazón.',tip:'Ordená los niveles desde el más pequeño al más grande.'},
{t:'Ecología',q:'Explicá la diferencia entre población y comunidad usando animales o plantas como ejemplo.',model:'Una población reúne individuos de una misma especie en una zona. Una comunidad reúne poblaciones de diferentes especies que viven e interactúan allí.',tip:'Preguntate si hablamos de una sola especie o de varias.'},
{t:'Ecología',q:'¿Qué es un ecosistema? Nombrá dos factores bióticos y dos abióticos.',model:'Un ecosistema incluye seres vivos, factores no vivos y sus relaciones. Ejemplos bióticos: árboles e insectos. Abióticos: agua y temperatura.',tip:'Biótico significa vivo; abiótico significa no vivo.'},
{t:'Ecología',q:'¿Qué diferencia hay entre un bioma y la biosfera?',model:'Un bioma agrupa ecosistemas semejantes por su vegetación y fauna. La biosfera comprende el conjunto de todos los biomas de la Tierra.',tip:'Uno agrupa ecosistemas parecidos; el otro abarca todos los biomas.'},
{t:'Fauna de Córdoba',q:'Explicá por qué la comadreja overa es un marsupial.',model:'Es un mamífero marsupial porque sus crías nacen poco desarrolladas y continúan creciendo en el marsupio de su madre, donde toman leche.',tip:'Pensá dónde se desarrollan las crías después de nacer.'},
{t:'Fauna de Córdoba',q:'¿Por qué decimos que la comadreja overa es omnívora? ¿Qué importancia tiene en el ambiente?',model:'Es omnívora porque come alimentos de origen animal y vegetal. Ayuda a controlar poblaciones de algunos animales y puede consumir carroña.',tip:'Recordá qué come y qué función cumple en la naturaleza.'},
{t:'Fauna de Córdoba',q:'¿Cómo se alimenta la curucucha y para qué le sirven las plumas timoneras?',model:'La curucucha come principalmente insectos y arácnidos. Las plumas timoneras de su cola le ayudan a dirigir el vuelo.',tip:'Una parte de la pregunta trata sobre su dieta; la otra, sobre su cola.'},
{t:'Organización de la vida',q:'Escribí un ejemplo de individuo, población, comunidad y ecosistema.',model:'Individuo: un zorro. Población: varios zorros de la misma especie en un área. Comunidad: zorros, árboles, insectos y aves de un lugar. Ecosistema: esos seres vivos junto con el suelo, el agua, la luz y sus interacciones.',tip:'Cada nivel agrega más componentes que el anterior.'}
];
let order=[],pos=0,answers=[],locked=false,selectedCount=10;

// Evaluación local orientativa. No es un modelo de IA ni sustituye la revisión docente.
const rubrics=[
 [['celul'],['vida','vivo','seres','organismo'],['basica','unidad','formad','funcion']],
 [['mitocondri'],['cloroplast'],['respira','energia'],['fotosint']],
 [['celul'],['tejid'],['organ'],['form','agrup','conjunto']],
 [['poblacion','poblaciones'],['especie','misma'],['comunidad'],['distintas','diferentes','varias']],
 [['ecosistem'],['vivos','biot','animales','plantas'],['abiot','agua','temperatura','luz','suelo'],['relacion','interact','conviv']],
 [['bioma'],['ecosistem','similares','parecidos'],['biosfera'],['todos','planeta','tierra']],
 [['marsup','bolsa'],['crias','bebes','hijos'],['nacen','desarroll','crecen'],['leche','madre']],
 [['omniv','animal','vegetal'],['insect','fruta','carne','plantas'],['control','plagas','carroña','muertos','ecosistem']],
 [['insect','araña','aracnid'],['plumas','cola','timoneras'],['vuelo','dirigir','direccion']],
 [['individuo','un zorro','un animal'],['poblacion','varios zorros','misma especie'],['comunidad','diferentes especies','plantas y animales'],['ecosistema','agua','suelo','luz','temperatura']]
];
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function evaluateWritten(id,response){
 const t=normalize(response), words=t.split(' ').filter(Boolean);
 if(words.length<3 || /^(no se|nose|no se nada|ni idea|no entiendo|asdf|qwerty|hola|jaja|xd)( |$)/.test(t) || !/[aeiou]/.test(t)) return {level:'unclear',title:'🤔 No entendí tu respuesta',detail:'Probá explicarlo con una oración completa. Podés usar tus propias palabras y dar un ejemplo.',retry:true};
 const groups=rubrics[id], hits=groups.map(g=>g.some(k=>t.includes(normalize(k)))), count=hits.filter(Boolean).length;
 const ratio=count/groups.length;
 if(ratio>=.75) return {level:'good',title:'🌟 ¡Muy bien!',detail:'Encontré las ideas principales que esperaba en esta explicación. ¡Seguí así!'};
 if(ratio>=.4) return {level:'partial',title:'🌱 ¡Vas encaminado!',detail:'Reconocí parte de la idea, pero faltan conceptos importantes. Compará tu respuesta con el ejemplo y fijate qué podés agregar.'};
 if(ratio>0) return {level:'wrong',title:'📚 Todavía no es correcto',detail:'Hay alguna palabra relacionada con el tema, pero no alcanza para explicar lo que se pregunta. Leé el ejemplo y volvé a intentarlo más adelante.'};
 return {level:'unclear',title:'🤔 No pude interpretar la respuesta',detail:'No encontré suficientes conceptos relacionados con la pregunta. Revisá si escribiste lo que querías decir y probá nuevamente.',retry:true};
}

const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(){let n=selectedCount,w=Math.max(1,Math.round(n*.3)),mc=n-w;let a=shuffle(questions.map((q,i)=>({type:'choice',id:i,t:q.t}))).slice(0,mc);let b=shuffle(writing.map((q,i)=>({type:'write',id:i,t:q.t}))).slice(0,w);order=shuffle([...a,...b]);pos=0;answers=[];renderQuestion()}
function home(){app.innerHTML=`<div class="heroIcon">🧬</div><div class="eyebrow">Un juego para aprender</div><h1>Descubrí el mundo de la vida.</h1><p>Elegí cuánto querés practicar. Vas a encontrar preguntas con opciones y desafíos para escribir tus propias respuestas. Después de cada pregunta, aprendés con una explicación.</p><div class="topics"><span class="pill">🧫 Células</span><span class="pill">🌳 Ecosistemas</span><span class="pill">🦊 Fauna de Córdoba</span><span class="pill">✍️ Respuestas escritas</span></div><div class="eyebrow">¿Cuántas preguntas querés jugar?</div><div class="choices">${[5,10,20].map(n=>`<button class="choice ${n===selectedCount?'active':''}" data-count="${n}" aria-pressed="${n===selectedCount}">${n}</button>`).join('')}</div><button class="btn" id="start">¡Empezar a jugar! →</button><p class="muted">Sin límite de tiempo · Se puede jugar desde el celular · Las respuestas escritas reciben una evaluación automática orientativa.</p>`;app.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{selectedCount=Number(b.dataset.count);home()});document.getElementById('start').onclick=start}
function renderQuestion(){locked=false;let item=order[pos],q=item.type==='write'?writing[item.id]:questions[item.id];app.innerHTML=`<div class="meta"><span>${esc(q.t)}</span><span>Pregunta ${pos+1} de ${order.length}</span></div><div class="bar"><div class="fill" style="width:${100*pos/order.length}%"></div></div><div class="eyebrow">${item.type==='write'?'✍️ Explicá con tus palabras':'Elegí una respuesta'}</div><h2>${esc(q.q)}</h2>${item.type==='write'?`<p class="help">Escribí tu respuesta. El juego intentará revisar los conceptos y te explicará cómo mejorar.</p><textarea id="response" class="writebox" placeholder="Escribí acá lo que aprendiste..." aria-label="Tu respuesta"></textarea><div class="actions"><span class="muted">No hace falta usar las mismas palabras del libro.</span><button class="btn" id="check" disabled>Ver explicación →</button></div>`:`<div id="options">${q.o.map((o,i)=>`<button class="option" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`}<div id="feedback" class="hidden" role="status"></div><div class="actions"><span class="muted">${item.type==='write'?'Corrección orientativa, sin IA.':'Equivocarse también ayuda a aprender.'}</span><button id="next" class="btn hidden">${pos===order.length-1?'Ver mis resultados':'Siguiente pregunta →'}</button></div>`;
if(item.type==='write'){let t=document.getElementById('response'),b=document.getElementById('check');t.oninput=()=>b.disabled=t.value.trim().length<8;b.onclick=()=>checkWriting()}else app.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))}
function showNext(){let b=document.getElementById('next');b.classList.remove('hidden');b.onclick=()=>{pos++;if(pos>=order.length)results();else renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}}
function answer(choice){if(locked)return;locked=true;let item=order[pos],q=questions[item.id],ok=choice===q.a;answers.push({type:'choice',id:item.id,ok});app.querySelectorAll('.option').forEach(b=>{let i=Number(b.dataset.i);b.disabled=true;if(i===q.a)b.classList.add('correct');if(i===choice&&!ok)b.classList.add('wrong')});let f=document.getElementById('feedback');f.className='feedback'+(ok?'':' wrong');f.innerHTML=`<strong>${ok?'🌟 ¡Muy bien!':'💡 ¡Buen intento! Aprendamos juntos.'}</strong><p>${ok?'Elegiste la respuesta correcta. ':'La respuesta correcta es <b>'+esc(q.o[q.a])+'</b>. '}${esc(q.e)}</p>`;showNext();f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function checkWriting(){
 if(locked)return;
 const item=order[pos],q=writing[item.id],response=document.getElementById('response').value.trim();
 const evaluation=evaluateWritten(item.id,response),f=document.getElementById('feedback');
 f.className='feedback'+(['wrong','unclear'].includes(evaluation.level)?' wrong':'');
 f.innerHTML=`<strong>${esc(evaluation.title)}</strong><p>${esc(evaluation.detail)}</p><p><b>Respuesta modelo para aprender:</b></p><div class="model">${esc(q.model)}</div><p><b>Pista:</b> ${esc(q.tip)}</p><p class="help">La evaluación es aproximada: busca conceptos, no entiende todos los significados. Una respuesta válida expresada de otra forma puede ser evaluada incorrectamente.</p>${evaluation.retry?'<button class="btn secondary" id="retry">✏️ Volver a escribir</button>':''}`;
 if(evaluation.retry){f.insertAdjacentHTML('beforeend',' <button class="btn secondary" id="skip">Seguir y repasar después →</button>');document.getElementById('retry').onclick=()=>{f.className='hidden';document.getElementById('response').focus()};document.getElementById('skip').onclick=()=>{locked=true;document.getElementById('response').disabled=true;document.getElementById('check').classList.add('hidden');document.getElementById('retry').disabled=true;document.getElementById('skip').disabled=true;answers.push({type:'write',id:item.id,ok:false,level:'unclear',response});showNext()};}
 else {locked=true;document.getElementById('response').disabled=true;document.getElementById('check').classList.add('hidden');answers.push({type:'write',id:item.id,ok:evaluation.level==='good',level:evaluation.level,response});showNext()}
 f.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function results(){let n=answers.filter(x=>x.ok).length,wrong=answers.filter(x=>!x.ok),pct=Math.round(100*n/order.length);app.innerHTML=`<div class="eyebrow">Desafío completado</div><div class="heroIcon">${pct>=80?'🏆':pct>=55?'🌱':'📚'}</div><h1>${pct>=80?'¡Gran trabajo!':pct>=55?'¡Vas muy bien!':'¡Cada intento enseña!'}</h1><div class="score">${n}<span style="font-size:24px;color:#799385"> / ${order.length}</span></div><p>Lograste ${pct}% de respuestas correctas o bien desarrolladas. Las respuestas escritas tienen una evaluación local orientativa, que puede equivocarse. No utiliza IA.</p>${wrong.length?`<h2 style="font-size:23px">Lo que podemos repasar</h2>${wrong.map(x=>{let q=x.type==='write'?writing[x.id]:questions[x.id];return `<div class="review"><b>${esc(q.q)}</b>${x.type==='write'?`<small><b>Tu respuesta:</b> ${esc(x.response)}</small><small><b>Ejemplo para estudiar:</b> ${esc(q.model)}</small>`:`<small><b>Respuesta: ${esc(q.o[q.a])}</b>${esc(q.e)}</small>`}</div>`}).join('')}`:'<p>¡No hay errores para repasar!</p>'}<div class="actions"><button class="btn" id="again">🔄 Volver a jugar</button><button class="btn secondary" id="share">Compartir juego</button></div>`;document.getElementById('again').onclick=home;document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'BioAventura',url:location.href})}catch(e){}}else if(navigator.clipboard&&location.protocol.startsWith('http')){await navigator.clipboard.writeText(location.href);alert('¡Enlace copiado!')}else alert('Cuando publiques el HTML, compartí la dirección de la página.')};window.scrollTo({top:0,behavior:'smooth'})}
home();
</script></body></html>
